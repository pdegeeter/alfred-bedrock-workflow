name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Apple Silicon runner: the workflow ships an arm64 macOS binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make check
