[package]
name = "alfred-bedrock"
version = "1.1.0"
edition = "2024"
description = "Alfred workflow for Amazon Bedrock"
authors = ["Philippe Degeeter <philippe@degeeter.fr>"]
license = "MIT"
repository = "https://github.com/pdegeeter/alfred-bedrock-workflow"
publish = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
